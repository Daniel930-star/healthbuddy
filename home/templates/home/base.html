<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Buddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Health Buddy</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Left menu -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/workouts/' %}active{% endif %}" href="/workouts/">Workouts</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/progress/' %}active{% endif %}" href="/progress/">Progress</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/nutrition/' %}active{% endif %}" href="/nutrition/">Nutrition</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/goals/' %}active{% endif %}" href="/goals/">Goals</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.path == '/water/' %}active{% endif %}" href="/water/">Water</a>
        </li>
      </ul>

      <!-- Right menu -->
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="/users/profile/">Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/users/logout/">Logout</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="/users/login/">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/users/register/">Register</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<!-- Page Content -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
