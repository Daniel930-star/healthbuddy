<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        body {
            background: #f5f7fa;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .welcome-title {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #typedText {
            font-size: 17px;
            color: #555;
            min-height: 50px;
            white-space: pre-wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
        }

        .card a {
            text-decoration: none;
            display: block;
            padding: 10px;
            margin-top: 12px;
            background: #0066ff;
            color: white;
            border-radius: 6px;
            transition: 0.3s;
        }

        .card a:hover {
            background: #004bcc;
        }
    </style>
</head>
<body>

<div class="dashboard-container">

    <div class="welcome-box">
        <div class="welcome-title">
            Welcome {{ user.first_name|default:user.username }}!
        </div>

        <div id="typedText"></div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-title">Workouts</div>
            <a href="/workouts/">Open</a>
        </div>

        <div class="card">
            <div class="card-title">Nutrition</div>
            <a href="/nutrition/">Open</a>
        </div>

        <div class="card">
            <div class="card-title">Water Intake</div>
            <a href="/water/">Open</a>
        </div>

        <div class="card">
            <div class="card-title">Goals</div>
            <a href="/progress/goals/">Open</a>
        </div>

        <div class="card">
            <div class="card-title">Progress</div>
            <a href="/progress/">Open</a>
        </div>
    </div>

</div>

<script>
    const text =
`Welcome back! Here's your personal health & fitness dashboard.

Navigate through your workouts, nutrition, water intake,
goals, and progress tracking — all in one place.`;

    let i = 0;
    function typeEffect() {
        if (i < text.length) {
            document.getElementById("typedText").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeEffect, 18);
        }
    }
    typeEffect();
</script>

</body>
</html>
