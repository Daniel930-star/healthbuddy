
<div class="container mt-5">
    <h2>My Workouts</h2>
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Name</th>
                <th>Duration</th>
                <th>Type</th>
                <th>Date</th>
                <th>Time</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for workout in workouts %}
            <tr>
                <td>{{ workout.name }}</td>
                <td>{{ workout.duration }}</td>
                <td>{{ workout.type }}</td>
                <td>{{ workout.date }}</td>
                <td>{{ workout.time }}</td>
                <td>
                    <!-- Edit Button triggers modal -->
                    <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#editModal{{ workout.id }}">
                        Edit
                    </button>

                    <!-- Modal -->
                    <div class="modal fade" id="editModal{{ workout.id }}" tabindex="-1" aria-hidden="true">
                      <div class="modal-dialog">
                        <div class="modal-content">
                          <div class="modal-header">
                            <h5 class="modal-title">Edit Workout</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                          </div>
                          <div class="modal-body">
                            <form method="POST" action="{% url 'edit_workout' workout.id %}">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="name{{ workout.id }}" class="form-label">Name</label>
                                    <input type="text" name="name" id="name{{ workout.id }}" value="{{ workout.name }}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="duration{{ workout.id }}" class="form-label">Duration</label>
                                    <input type="text" name="duration" id="duration{{ workout.id }}" value="{{ workout.duration }}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="type{{ workout.id }}" class="form-label">Type</label>
                                    <input type="text" name="type" id="type{{ workout.id }}" value="{{ workout.type }}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="date{{ workout.id }}" class="form-label">Date</label>
                                    <input type="date" name="date" id="date{{ workout.id }}" value="{{ workout.date }}" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="time{{ workout.id }}" class="form-label">Time</label>
                                    <input type="time" name="time" id="time{{ workout.id }}" value="{{ workout.time }}" class="form-control">
                                </div>
                                <button type="submit" class="btn btn-success">Save Changes</button>
                            </form>
                          </div>
                        </div>
                      </div>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Bootstrap JS (5.3.2 CDN) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
