{% extends "users/base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="mt-2">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
