{% extends "nutrition/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <h2>Edit Nutrition Log</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary">Save Changes</button>
        <a href="{% url 'nutrition:nutrition_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
