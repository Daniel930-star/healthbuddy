{% extends "nutrition/base.html" %}

{% block content %}
<div class="container mt-5">
    <h3>Delete Meal</h3>
    <p>Are you sure you want to delete <strong>{{ log.food_name }}</strong>?</p>

    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger">Delete</button>
        <a href="{% url 'nutrition:nutrition_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
